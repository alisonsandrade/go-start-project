definitions:
  apiresponse.ErrorResponse:
    properties:
      error:
        example: invalid credentials
        type: string
    type: object
  apiresponse.MessageResponse:
    properties:
      message:
        example: operation completed successfully
        type: string
    type: object
  domain.AuthResponseDTO:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/domain.User'
    type: object
  domain.CreateRoleRequest:
    properties:
      description:
        type: string
      name:
        maxLength: 50
        minLength: 2
        type: string
    required:
    - name
    type: object
  domain.CreateUserRequest:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      email:
        type: string
      job_title:
        type: string
      name:
        type: string
      password:
        type: string
      phone:
        type: string
      role:
        $ref: '#/definitions/domain.Role'
    type: object
  domain.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  domain.Permission:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
    type: object
  domain.RefreshTokenDTO:
    properties:
      refresh_token:
        example: dGhpcy1pcy1hLXJlZnJlc2gtdG9rZW4...
        type: string
    required:
    - refresh_token
    type: object
  domain.RegisterRequest:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      email:
        type: string
      job_title:
        type: string
      name:
        type: string
      password:
        type: string
      phone:
        type: string
      role:
        $ref: '#/definitions/domain.Role'
    type: object
  domain.ReplacePermissionsRequest:
    properties:
      permission_ids:
        items:
          type: string
        type: array
    type: object
  domain.Role:
    enum:
    - ADMIN
    - USER
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleUser
  domain.RoleEntity:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      is_system:
        type: boolean
      name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/domain.Permission'
        type: array
      updated_at:
        type: string
    type: object
  domain.UpdateRoleRequest:
    properties:
      description:
        type: string
      name:
        maxLength: 50
        minLength: 2
        type: string
    required:
    - name
    type: object
  domain.UpdateUserRequest:
    properties:
      avatar_url:
        example: https://github.com/alisonsandrade/avatar.jpg
        type: string
      bio:
        example: Desenvolvedor Backend Go
        type: string
      job_title:
        example: Tech Lead
        type: string
      name:
        example: Alison Andrade
        type: string
      phone:
        example: "7599999999"
        type: string
    type: object
  domain.User:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      job_title:
        type: string
      name:
        type: string
      phone:
        type: string
      role:
        $ref: '#/definitions/domain.Role'
      updated_at:
        type: string
    type: object
info:
  contact: {}
  description: API do projeto Go Start.
  title: Go Start API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates credentials and returns a JWT access token and a
        refresh token
      parameters:
      - description: Login credentials
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/domain.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.AuthResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
      summary: User authentication
      tags:
      - Auth
  /api/auth/logout:
    post:
      description: Invalidates the session by revoking all of the user's refresh tokens
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiresponse.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - Auth
  /api/auth/refresh:
    post:
      consumes:
      - application/json
      description: Receives the current refresh token and returns a new token pair,
        rotating the session
      parameters:
      - description: Refresh token
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/domain.RefreshTokenDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.AuthResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
      summary: Refresh session (tokens)
      tags:
      - Auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Registers a new user with the default USER role and returns a token
        pair
      parameters:
      - description: User registration data
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/domain.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.AuthResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
      summary: Public user registration
      tags:
      - Auth
  /api/roles:
    get:
      description: Returns all roles registered in the system
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.RoleEntity'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List roles
      tags:
      - Roles
    post:
      consumes:
      - application/json
      description: Creates a new role
      parameters:
      - description: Role payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/domain.CreateRoleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.RoleEntity'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create role
      tags:
      - Roles
  /api/roles/{id}:
    delete:
      description: Deletes a role
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiresponse.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete role
      tags:
      - Roles
    get:
      description: Returns a role by its UUID
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.RoleEntity'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get role
      tags:
      - Roles
    put:
      consumes:
      - application/json
      description: Updates an existing role
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      - description: Role payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.RoleEntity'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update role
      tags:
      - Roles
  /api/roles/{id}/permissions:
    put:
      consumes:
      - application/json
      description: Replaces all permissions assigned to a role
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      - description: Permission IDs
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/domain.ReplacePermissionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiresponse.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Replace role permissions
      tags:
      - Roles
  /api/users:
    get:
      description: Retorna lista de todos os usuários cadastrados. Acesso restrito
        a ADMIN.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.User'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar todos os usuários (RBAC - ADMIN)
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Cria um novo usuário para acesso ao sistema.
      parameters:
      - description: Campos para cadastrar novo usuário
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/domain.CreateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Criar um novo perfil do usuário
      tags:
      - Users
  /api/users/me:
    delete:
      description: Realiza a exclusão lógica do usuário autenticado no sistema
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiresponse.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Deletar perfil do usuário logado (Soft Delete)
      tags:
      - Users
    get:
      description: Retorna os detalhes do usuário logado via Bearer JWT
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Obter perfil do usuário autenticado
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: Atualiza dados cadastrais do próprio usuário autenticado
      parameters:
      - description: Campos para atualização
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apiresponse.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Atualizar perfil do usuário logado
      tags:
      - Users
securityDefinitions:
  BearerAuth:
    description: Digite "Bearer" seguido de um espaço e o seu token JWT.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
